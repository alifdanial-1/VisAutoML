name: Deploy to AWS EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Build frontend
        run: |
          cd VisAutoML/Frontend &&          
          npm install
          npm run build

      - name: Copy frontend build to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r VisAutoML/Frontend/build ubuntu@${{ secrets.EC2_PUBLIC_IP }}:/tmp/frontend-build

      - name: Deploy backend and frontend on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 ubuntu@${{ secrets.EC2_PUBLIC_IP }} "
            echo 'Pulling latest code...' &&
            cd ~/VisAutoML &&
            git fetch origin &&
            git reset --hard origin/dev &&

            echo 'Deploying frontend...' &&
            sudo rm -rf /var/www/vhosts/frontend &&
            sudo mkdir -p /var/www/vhosts/frontend &&
            sudo cp -R /tmp/frontend-build/* /var/www/vhosts/frontend/ &&

            echo 'Setting up backend...' &&
            cd Backend &&
            python3 -m venv venv &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&

            echo 'Applying DB migrations...' &&
            python manage.py migrate &&

            echo 'Cleaning old staticfiles...' &&
            rm -rf staticfiles &&

            echo 'Collecting static files...' &&
            python manage.py collectstatic --noinput &&

            echo 'Restarting services...' &&
            sudo systemctl restart gunicorn &&
            sudo systemctl restart dashboard &&
            sudo systemctl restart nginx
          "
